$kind: http-request
url: "{{baseUrl}}/courses/{{courseId}}/instructors"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "instructors": [
        "{{instructorId}}"
      ]
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200", () => pm.response.to.have.status(200));
    language: text/javascript
order: 6000
