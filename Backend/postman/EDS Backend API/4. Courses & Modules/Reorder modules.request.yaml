$kind: http-request
url: "{{baseUrl}}/courses/{{courseId}}/modules/order"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "moduleIds": [
        "{{moduleId2}}",
        "{{moduleId}}"
      ]
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200", () => pm.response.to.have.status(200));
    language: text/javascript
order: 14000
