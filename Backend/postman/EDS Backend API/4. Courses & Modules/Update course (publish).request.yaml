$kind: http-request
url: "{{baseUrl}}/courses/{{courseId}}"
method: PATCH
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "status": "published",
      "price": 140000
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200", () => pm.response.to.have.status(200));
    language: text/javascript
order: 5000
