$kind: http-request
url: "{{baseUrl}}/courses"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "title": "Anatomy 101",
      "description": "Intro course",
      "category": "Medical",
      "price": 150000
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 201", () => pm.response.to.have.status(201));
      pm.environment.set('courseId', pm.response.json().data.course.id);
      pm.environment.set('courseSlug', pm.response.json().data.course.slug);
    language: text/javascript
order: 1000
