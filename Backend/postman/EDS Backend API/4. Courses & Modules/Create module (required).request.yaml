$kind: http-request
url: "{{baseUrl}}/courses/{{courseId}}/modules"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "title": "Bones & Joints",
      "description": "Module 1",
      "price": 50000,
      "isRequired": true,
      "status": "published"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 201", () => pm.response.to.have.status(201));
      pm.environment.set('moduleId', pm.response.json().data.module.id);
    language: text/javascript
order: 7000
