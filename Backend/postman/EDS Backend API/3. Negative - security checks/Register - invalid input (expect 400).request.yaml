$kind: http-request
url: "{{baseUrl}}/auth/register"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "name": "A",
      "email": "bad",
      "password": "123"
    }
scripts:
  - type: afterResponse
    code: pm.test("Status is 400", () => pm.response.to.have.status(400));
    language: text/javascript
order: 1000
