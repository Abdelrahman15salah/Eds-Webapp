$kind: http-request
url: "{{baseUrl}}/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "{{email}}",
      "password": "{{password}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200", () => pm.response.to.have.status(200));
      pm.environment.set('userId', pm.response.json().data.user.id);
      pm.test('Auth cookies set', () => { pm.expect(pm.cookies.has('access_token')).to.be.true; pm.expect(pm.cookies.has('csrf_token')).to.be.true; });
    language: text/javascript
order: 3000
