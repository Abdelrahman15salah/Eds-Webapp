$kind: http-request
name: Update me (name / phone)
url: "{{baseUrl}}/auth/me"
method: PATCH
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "name": "Updated Name",
      "phoneNumber": "+201001234567"
    }
scripts:
  - type: afterResponse
    code: pm.test("Status is 200", () => pm.response.to.have.status(200));
    language: text/javascript
order: 5000
