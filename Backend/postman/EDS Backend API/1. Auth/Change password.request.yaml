$kind: http-request
description: Signs out all OTHER sessions; this one stays signed in. Afterwards
  update {{password}} in the environment.
url: "{{baseUrl}}/auth/change-password"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "currentPassword": "{{password}}",
      "newPassword": "{{newPassword}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200", () => pm.response.to.have.status(200));
      // Swap passwords so the request can be run again to change back.
      const cur = pm.environment.get('password'); pm.environment.set('password', pm.environment.get('newPassword')); pm.environment.set('newPassword', cur);
    language: text/javascript
order: 7000
